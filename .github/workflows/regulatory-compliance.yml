name: Regulatory Compliance (IEC 62304 Traceability)

# =============================================================================
# IEC 62304 §5.1.1 — Traceability Enforcement
#
# This workflow ensures ALL tests have regulatory traceability markers
# (@pytest.mark.requirement, @pytest.mark.risk, or @pytest.mark.design).
# Tests without markers cannot be traced to requirements and will BLOCK the PR.
#
# Configure as a REQUIRED status check in GitHub branch protection rules.
# =============================================================================

on:
  pull_request:
    branches: [ main, PRECISE-HBR ]
    paths:
      - 'tests/**'
      - '**.py'
  push:
    branches: [ main, PRECISE-HBR ]
    paths:
      - 'tests/**'
      - '**.py'

env:
  PYTHON_VERSION: '3.11'

jobs:
  regulatory-marker-enforcement:
    name: "Regulatory Marker Enforcement (IEC 62304 §5.1.1)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-html pytest-timeout

    - name: Create test directories
      run: mkdir -p instance/flask_session reports

    - name: Check regulatory marker coverage
      run: |
        echo "============================================"
        echo "  IEC 62304 Regulatory Marker Enforcement"
        echo "  Checking all tests have traceability markers"
        echo "============================================"
        pytest tests/ \
          --enforce-regulatory-markers \
          --collect-only -q \
          --ignore=tests/test_performance.py \
          2>&1 || true

        # Run full test suite with enforcement — exit code reflects compliance
        pytest tests/ \
          --enforce-regulatory-markers \
          --timeout=30 \
          --junitxml=reports/regulatory-compliance-results.xml \
          -v --tb=line \
          --ignore=tests/test_performance.py
      env:
        FLASK_SECRET_KEY: test-secret-key-for-ci-only-not-for-production
        SMART_CLIENT_ID: test-client-id
        SMART_REDIRECT_URI: http://localhost:8080/callback
        TESTING: "true"

    - name: Upload traceability reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: regulatory-compliance-reports
        path: |
          reports/regulatory-compliance-results.xml
          reports/test-traceability.json
          reports/test-traceability.md
        retention-days: 2555

    - name: Compliance Summary
      if: always()
      run: |
        echo "## IEC 62304 Regulatory Compliance" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f reports/test-traceability.json ]; then
          TOTAL=$(python -c "import json; d=json.load(open('reports/test-traceability.json')); print(d['total_tests'])")
          TRACED=$(python -c "import json; d=json.load(open('reports/test-traceability.json')); print(d['total_traced_tests'])")
          UNTRACED=$(python -c "import json; d=json.load(open('reports/test-traceability.json')); print(d['total_untraced_tests'])")
          PCT=$(python -c "import json; d=json.load(open('reports/test-traceability.json')); print(d['traceability_coverage_pct'])")

          echo "### Traceability Coverage: ${PCT}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total tests | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Traced tests | ${TRACED} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Untraced tests** | **${UNTRACED}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$UNTRACED" != "0" ]; then
            echo "### Untraced Tests" >> $GITHUB_STEP_SUMMARY
            echo "The following tests are missing \`@pytest.mark.requirement\`, \`@pytest.mark.risk\`, or \`@pytest.mark.design\` markers:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python -c "import json; d=json.load(open('reports/test-traceability.json')); [print(f'- \`{t}\`') for t in d.get('untraced_tests', [])]" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "No traceability report generated." >> $GITHUB_STEP_SUMMARY
        fi
